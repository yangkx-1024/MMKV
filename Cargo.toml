[package]
name = "mmkv"
version = "0.9.1"
edition = "2024"
authors = ["Kexuan Yang <kexuan.yang@gmail.com>"]
description = "Rust version of MMKV"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yangkx-1024/MMKV"
keywords = ["key-value", "mmkv"]
exclude = [
    "android", "ios", "build.sh", "build_android.sh",
    "build_apple.sh", "Package.swift", ".fleet", ".github",
    ".space"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
buffa = "0.6"
libc = "0.2"
crc = "3.4"
eax = { version = "0.6.0-rc.3", optional = true }
aes = { version = "0.9", optional = true }
aead-stream = { version = "0.6.0-rc.3", features = ["alloc"], optional = true }
getrandom = { version = "0.4", optional = true }
hex = { version = "0.4.3", optional = true }
mmkv-proc-macro-lib = { version = "0.0.3" }
chrono = { version = "0.4" }
once_cell = { version = "1.21" }
crossbeam-channel = "0.5"
arc-swap = "1"

[build-dependencies]
buffa-build = "0.6"

[features]
default = []
encryption = ["dep:eax", "dep:aes", "dep:aead-stream", "dep:getrandom", "dep:hex"]

[target.'cfg(target_os="android")'.dependencies]
jni = { version = "0.22", features = ["invocation"] }

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
